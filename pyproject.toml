[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-w-thruster-control"
version = "0.1.0"
description = "Pico W thruster, servo, and actuator control with a Jetson diagnostic menu"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "pyserial>=3.5",
    "questionary>=2.0",
    "mpremote>=1.22",
]

[project.scripts]
diagnostics = "diagnostics.menu:main"
upload = "scripts.upload:main"

[tool.setuptools]
packages = ["diagnostics", "scripts", "firmware"]
